[package]
name = "Rust-SQL"
version = "1.41.0"
edition = "2021"
authors = ["Mohammed Elhasnaoui <77762120+Rain6435@users.noreply.github.com>"]
description = "A fast, lightweight, cross-database, and cross-platform SQL client written in Rust"
license = "MIT"
repository = "https://github.com/Rain6435/Rust-SQL"
default-run = "Rust-SQL"

[lib]
name = "rust_sql"
path = "src/lib.rs"

[[bin]]
name = "Rust-SQL"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
base64 = "0.22"
rand = "0.10"
csv = "1.3"
regex = "1.10"
url = "2.5"
dirs = "7.0"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["column_decltype"] }
tokio-postgres = "0.7"
ratatui = "0.30"
crossterm = "0.29"
axum = { version = "0.8", features = ["ws", "macros"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["default"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
self-replace = "1.5"
tempfile = "3.12"

[dev-dependencies]
