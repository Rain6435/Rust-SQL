[package]
name = "Rust-SQL"
version = "1.41.1"
edition = "2021"
authors = ["Mohammed Elhasnaoui <77762120+Rain6435@users.noreply.github.com>"]
description = "A fast, lightweight, cross-database, and cross-platform SQL client written in Rust"
license = "MIT"
repository = "https://github.com/Rain6435/Rust-SQL"
default-run = "Rust-SQL"

[lib]
name = "rust_sql"
path = "src/lib.rs"

[[bin]]
name = "Rust-SQL"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
keyring = "4.2"
base64 = "0.22"
rand = "0.10"
csv = "1.3"
regex = "1.10"
url = "2.5"
dirs = "7.0"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["column_decltype"] }
tokio-postgres = { version = "0.7", features = ["with-time-0_3", "with-serde_json-1", "with-uuid-1"] }
bytes = "1"
ratatui = "0.30"
crossterm = "0.29"
axum = { version = "0.8", features = ["ws", "macros"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["default"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.11"
flate2 = "1.0"
tar = "0.4"
zip = { version = "9.6", default-features = false, features = ["deflate"] }
self-replace = "1.5"
tempfile = "3.12"
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
zeroize = "1"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
argon2 = "0.6"
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7"
sqlparser = "0.64.0"

[dev-dependencies]
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# Argon2id is far too slow unoptimized; keep password hashing fast in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
