version: "3.8"

services:
  rust-sql-web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUST_SQL_HOME=/data
    volumes:
      - rust_sql_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rust_sql
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rust_sql
    ports:
      - "3306:3306"

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: rust_sql
    ports:
      - "3307:3306"

  # SSH bastion for tests/ssh_tunnel_suite.rs. The ssh-tunnel mod turns on AllowTcpForwarding.
  ssh-bastion:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=tunnel
      - USER_PASSWORD=tunnel-password
      - PASSWORD_ACCESS=true
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel
    ports:
      - "2222:2222"
    networks:
      - default
      - private

  # Reachable only from ssh-bastion: internal network, no published port.
  postgres-private:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rust_sql
    networks:
      - private

networks:
  private:
    internal: true

volumes:
  rust_sql_data:
