version: "3.8"

services:
  rust-sql-web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUST_SQL_HOME=/data
    volumes:
      - rust_sql_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rust_sql
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rust_sql
    ports:
      - "3306:3306"

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: rust_sql
    ports:
      - "3307:3306"

volumes:
  rust_sql_data:
